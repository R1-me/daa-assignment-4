name: Public checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java setup
        run: python tools/run.py --setup
      - name: Public cases and repeated batch
        run: python tools/run.py --check
      - name: Student tests
        run: |
          python tests/student/check.py
          python tests/student/scale.py
